<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Nukkad Proposed Solution</title>
  <desc id="desc">A 4K presentation slide explaining the problem for kirana stores and Razorpay, and the Nukkad agentic commerce solution.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="hill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="blueFooter" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M2,2 L16,9 L2,16 Z" fill="#2f6f1f"/>
    </marker>
    <style>
      .font { font-family: Poppins, Arial, Helvetica, sans-serif; }
      .page { fill: #ffffff; }
      .title { font: 800 72px Poppins, Arial, sans-serif; fill: #0a0a0a; }
      .brand { font: 800 33px Poppins, Arial, sans-serif; fill: #0a0a0a; }
      .heading { font: 800 42px Poppins, Arial, sans-serif; fill: #171717; }
      .subhead { font: 800 36px Poppins, Arial, sans-serif; fill: #171717; }
      .body { font: 500 24px Poppins, Arial, sans-serif; fill: #111827; }
      .body2 { font: 500 21px Poppins, Arial, sans-serif; fill: #111827; }
      .small { font: 500 18px Poppins, Arial, sans-serif; fill: #374151; }
      .tiny { font: 600 15px Poppins, Arial, sans-serif; fill: #475569; }
      .number { font: 800 58px Poppins, Arial, sans-serif; fill: #fb3b12; }
      .greenTitle { font: 800 24px Poppins, Arial, sans-serif; fill: #2f6f1f; }
      .featureNo { font: 800 54px Poppins, Arial, sans-serif; fill: #3d7d2a; }
      .featureTitle { font: 800 23px Poppins, Arial, sans-serif; fill: #2f6f1f; }
      .featureText { font: 500 21px Poppins, Arial, sans-serif; fill: #111827; }
      .orangeLine { stroke: #ff3d17; stroke-width: 5; stroke-linecap: round; }
      .greenLine { stroke: #2f6f1f; stroke-width: 4; stroke-linecap: round; }
      .card { fill: #ffffff; stroke: #94b886; stroke-width: 2.2; filter: url(#shadow); }
      .soft { fill: #f8fafc; stroke: #d9e5d0; stroke-width: 1.8; }
      .highlight { fill: #fff200; opacity: 0.78; }
      .dash { stroke: #2f6f1f; stroke-width: 4; stroke-dasharray: 16 15; fill: none; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect class="page" width="3840" height="2160"/>

  <!-- Header -->
  <ellipse cx="246" cy="132" rx="162" ry="72" fill="#ffffff" stroke="#0a0a0a" stroke-width="8"/>
  <text x="142" y="146" class="brand">Nukkad</text>
  <text x="1510" y="118" class="title">Proposed Solution</text>

  <g transform="translate(3130 48)">
    <path d="M72 84 C28 84 8 58 8 28 M72 84 C116 84 136 58 136 28" fill="none" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 10 V160" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round"/>
    <rect x="34" y="32" width="32" height="96" rx="13" fill="#ff5b20"/>
    <rect x="78" y="32" width="32" height="96" rx="13" fill="#16a34a"/>
    <path d="M36 52 h28 M36 74 h28 M36 96 h28 M80 52 h28 M80 74 h28 M80 96 h28" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="164" y="52" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">SMART INDIA</text>
    <text x="164" y="90" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">HACKATHON</text>
    <text x="164" y="128" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">2026</text>
  </g>

  <!-- Problem block -->
  <text x="112" y="286" class="heading">The Problem and Its Consequences</text>
  <text x="112" y="332" class="body">Local kirana stores are losing daily essentials demand to Blinkit, Zepto and</text>
  <text x="112" y="366" class="body">quick-delivery apps. Customers now expect home delivery, zero effort ordering,</text>
  <text x="112" y="400" class="body">digital bills and instant payment links, while most shops still depend on manual</text>
  <text x="112" y="434" class="body">WhatsApp notes, phone calls, Paytm or PhonePe collection, and memory-based stock.</text>

  <!-- Four problem consequences -->
  <g transform="translate(112 500)">
    <g>
      <path d="M0 0 V282" class="orangeLine"/>
      <text x="36" y="66" class="number">01</text>
      <path d="M36 92 H88" class="orangeLine"/>
      <text x="104" y="45" class="greenTitle">Customer Habit</text>
      <text x="104" y="76" class="greenTitle">Shifted Online</text>
      <text x="36" y="129" class="small">Families choose quick apps because</text>
      <text x="36" y="155" class="small">ordering takes no call, no typing and</text>
      <text x="36" y="181" class="small">delivery comes straight home.</text>
      <g transform="translate(520 54)">
        <circle cx="76" cy="76" r="74" fill="#fff1e8"/>
        <rect x="22" y="74" width="108" height="58" rx="14" fill="#111827"/>
        <rect x="38" y="42" width="76" height="48" rx="8" fill="#22c55e"/>
        <circle cx="48" cy="140" r="12" fill="#fb3b12"/>
        <circle cx="118" cy="140" r="12" fill="#fb3b12"/>
        <path d="M52 66 h48 M52 82 h34" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <g transform="translate(770 0)">
      <path d="M0 0 V282" class="orangeLine"/>
      <text x="36" y="66" class="number">02</text>
      <path d="M36 92 H88" class="orangeLine"/>
      <text x="104" y="45" class="greenTitle">Manual Operations</text>
      <text x="104" y="76" class="greenTitle">Cannot Match Apps</text>
      <text x="36" y="129" class="small">Stock, orders, customer reminders</text>
      <text x="36" y="155" class="small">and supplier calls stay manual, so</text>
      <text x="36" y="181" class="small">service feels slower and uncertain.</text>
      <g transform="translate(520 54)">
        <circle cx="76" cy="76" r="74" fill="#f4f4f5"/>
        <rect x="18" y="28" width="48" height="58" rx="7" fill="#e5e7eb" stroke="#111827" stroke-width="4"/>
        <rect x="90" y="24" width="48" height="58" rx="7" fill="#e5e7eb" stroke="#111827" stroke-width="4"/>
        <rect x="54" y="106" width="48" height="58" rx="7" fill="#e5e7eb" stroke="#111827" stroke-width="4"/>
        <path d="M66 56 H90 M78 86 V106" stroke="#111827" stroke-width="5"/>
        <path d="M112 92 l22 22 M134 92 l-22 22" stroke="#fb3b12" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g transform="translate(0 308)">
      <path d="M0 0 V282" class="orangeLine"/>
      <text x="36" y="66" class="number">03</text>
      <path d="M36 92 H88" class="orangeLine"/>
      <text x="104" y="45" class="greenTitle">Payments Stay</text>
      <text x="104" y="76" class="greenTitle">Outside Razorpay</text>
      <text x="36" y="129" class="small">Many kiranas collect through Paytm,</text>
      <text x="36" y="155" class="small">PhonePe or cash, so Razorpay stays</text>
      <text x="36" y="181" class="small">a side gateway on large platforms.</text>
      <g transform="translate(520 54)">
        <circle cx="76" cy="76" r="74" fill="#fff1e8"/>
        <rect x="36" y="28" width="82" height="124" rx="14" fill="#111827"/>
        <rect x="46" y="44" width="62" height="78" rx="5" fill="#f8fafc"/>
        <text x="58" y="95" font-family="Poppins, Arial" font-size="28" font-weight="900" fill="#2563eb">UPI</text>
        <path d="M128 42 C156 62 156 102 128 122" fill="none" stroke="#fb3b12" stroke-width="6" stroke-linecap="round"/>
        <path d="M142 28 C184 58 184 106 142 136" fill="none" stroke="#fb3b12" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g transform="translate(770 308)">
      <path d="M0 0 V282" class="orangeLine"/>
      <text x="36" y="66" class="number">04</text>
      <path d="M36 92 H88" class="orangeLine"/>
      <text x="104" y="45" class="greenTitle">No Proactive</text>
      <text x="104" y="76" class="greenTitle">Customer Intelligence</text>
      <text x="36" y="129" class="small">The shop knows customers personally,</text>
      <text x="36" y="155" class="small">but cannot calculate when atta, oil,</text>
      <text x="36" y="181" class="small">salt or tea will run out.</text>
      <g transform="translate(520 54)">
        <circle cx="76" cy="76" r="74" fill="#f4f4f5"/>
        <path d="M48 116 C50 72 102 72 104 116" fill="none" stroke="#111827" stroke-width="8"/>
        <circle cx="76" cy="54" r="25" fill="#111827"/>
        <path d="M112 44 l36 -18 M118 70 h42 M112 96 l36 18" stroke="#fb3b12" stroke-width="6" stroke-linecap="round"/>
        <circle cx="162" cy="26" r="9" fill="#fb3b12"/>
        <circle cx="168" cy="70" r="9" fill="#fb3b12"/>
        <circle cx="162" cy="116" r="9" fill="#fb3b12"/>
      </g>
    </g>
  </g>

  <!-- Solution block -->
  <text x="1900" y="286" class="heading">What Nukkad Actually Builds</text>
  <rect x="1902" y="323" width="450" height="30" class="highlight"/>
  <rect x="2548" y="323" width="590" height="30" class="highlight"/>
  <rect x="1902" y="363" width="676" height="30" class="highlight"/>
  <rect x="2766" y="363" width="470" height="30" class="highlight"/>
  <rect x="1902" y="403" width="556" height="30" class="highlight"/>
  <rect x="2614" y="403" width="572" height="30" class="highlight"/>
  <text x="1900" y="348" class="body">Nukkad turns a kirana into an AI commerce desk: it reads supplier bills,</text>
  <text x="1900" y="388" class="body">updates the catalogue, predicts household run-out, calls customers in Hinglish,</text>
  <text x="1900" y="428" class="body">builds an editable basket, sends a Razorpay payment link on WhatsApp, and</text>
  <text x="1900" y="468" class="body">settles stock only after verified payment. Razorpay moves from a passive</text>
  <text x="1900" y="508" class="body">checkout button into the operating layer for local retail.</text>

  <!-- Right illustration -->
  <g transform="translate(1850 620)">
    <path d="M40 360 C230 130 430 160 600 300 C760 430 975 305 1180 365 L1180 480 L40 480 Z" fill="url(#hill)" opacity="0.88"/>
    <path d="M360 310 C475 190 650 180 810 318" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M405 286 C528 224 650 226 775 318" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M430 343 C575 280 704 286 850 350" fill="none" stroke="#0f172a" stroke-width="5" stroke-dasharray="18 14"/>

    <!-- Kirana shop -->
    <g transform="translate(40 126)">
      <rect x="0" y="134" width="210" height="144" rx="12" fill="#fff7ed" stroke="#111827" stroke-width="5"/>
      <path d="M-12 134 H222 L186 74 H24 Z" fill="#ef4444" stroke="#111827" stroke-width="5"/>
      <rect x="30" y="172" width="56" height="106" fill="#16a34a"/>
      <rect x="112" y="174" width="72" height="54" fill="#fef3c7" stroke="#111827" stroke-width="4"/>
      <text x="30" y="122" font-family="Poppins, Arial" font-size="34" font-weight="900" fill="#111827">KIRANA</text>
    </g>

    <!-- Agent signals -->
    <path d="M280 190 C450 62 740 54 970 126" class="dash"/>
    <path d="M280 258 C524 314 732 314 1030 232" class="dash"/>
    <path d="M280 322 C520 438 760 424 1084 332" class="dash"/>

    <!-- Phone/customer -->
    <g transform="translate(1060 96)">
      <rect x="0" y="0" width="92" height="182" rx="17" fill="#111827"/>
      <rect x="14" y="22" width="64" height="112" rx="7" fill="#ecfdf5"/>
      <circle cx="46" cy="158" r="9" fill="#f8fafc"/>
      <path d="M-88 20 C-130 60 -130 112 -88 152" fill="none" stroke="#fb3b12" stroke-width="8" stroke-linecap="round"/>
      <path d="M-118 -4 C-174 58 -174 114 -118 178" fill="none" stroke="#fb3b12" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Razorpay node -->
    <g transform="translate(650 110)">
      <circle cx="70" cy="70" r="68" fill="#e0f2fe" stroke="#2563eb" stroke-width="5"/>
      <text x="24" y="84" font-family="Poppins, Arial" font-size="36" font-weight="900" fill="#2563eb">RZP</text>
    </g>

    <!-- Supplier -->
    <g transform="translate(812 286)">
      <rect x="0" y="0" width="150" height="86" rx="13" fill="#ecfdf5" stroke="#166534" stroke-width="5"/>
      <text x="24" y="36" font-family="Poppins, Arial" font-size="22" font-weight="900" fill="#166534">SUPPLIER</text>
      <text x="24" y="64" font-family="Poppins, Arial" font-size="18" font-weight="600" fill="#166534">night order</text>
    </g>
  </g>

  <!-- Unique Key Features -->
  <text x="196" y="1272" class="heading">Unique Key Features</text>

  <g transform="translate(162 1348)">
    <g>
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">01</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">WhatsApp-First</text>
      <text x="52" y="210" class="featureTitle">Shopfront</text>
      <text x="52" y="278" class="featureText">Customers order from the</text>
      <text x="52" y="312" class="featureText">same chat they already use:</text>
      <text x="52" y="346" class="featureText">text, photo, voice-note and</text>
      <text x="52" y="380" class="featureText">payment replies.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(455 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">02</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Bill OCR to</text>
      <text x="52" y="210" class="featureTitle">Live Catalogue</text>
      <text x="52" y="278" class="featureText">Supplier bills are read by</text>
      <text x="52" y="312" class="featureText">vision, repaired, priced and</text>
      <text x="52" y="346" class="featureText">merged into SKUs with a</text>
      <text x="52" y="380" class="featureText">critic before persistence.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(910 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">03</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Grounded Product</text>
      <text x="52" y="210" class="featureTitle">Resolution</text>
      <text x="52" y="278" class="featureText">Hinglish requests map to</text>
      <text x="52" y="312" class="featureText">real catalogue rows using</text>
      <text x="52" y="346" class="featureText">aliases, fuzzy match, stock</text>
      <text x="52" y="380" class="featureText">and household purchase prior.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(1365 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">04</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Realtime Care</text>
      <text x="52" y="210" class="featureTitle">Calling Agent</text>
      <text x="52" y="278" class="featureText">Twilio streams call audio,</text>
      <text x="52" y="312" class="featureText">Sarvam listens and speaks,</text>
      <text x="52" y="346" class="featureText">and barge-in keeps the call</text>
      <text x="52" y="380" class="featureText">feeling natural.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(1820 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">05</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Desk-Based</text>
      <text x="52" y="210" class="featureTitle">Agent Runtime</text>
      <text x="52" y="278" class="featureText">Reception, Seller, Checkout</text>
      <text x="52" y="312" class="featureText">and Enquiry share memory,</text>
      <text x="52" y="346" class="featureText">pending actions, basket and</text>
      <text x="52" y="380" class="featureText">typed outcomes.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(2275 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">06</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Razorpay-Led</text>
      <text x="52" y="210" class="featureTitle">Local Payments</text>
      <text x="52" y="278" class="featureText">Payment links are generated</text>
      <text x="52" y="312" class="featureText">after final basket approval;</text>
      <text x="52" y="346" class="featureText">webhooks verify money before</text>
      <text x="52" y="380" class="featureText">stock or fulfilment moves.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>

    <g transform="translate(2730 0)">
      <rect width="415" height="482" rx="13" class="card"/>
      <text x="52" y="82" class="featureNo">07</text>
      <path d="M52 112 H122" class="greenLine"/>
      <text x="52" y="180" class="featureTitle">Measured Agent</text>
      <text x="52" y="210" class="featureTitle">Reliability</text>
      <text x="52" y="278" class="featureText">Dialogue, resolver, photo,</text>
      <text x="52" y="312" class="featureText">bill OCR, payment safety,</text>
      <text x="52" y="346" class="featureText">ASR/TTS and latency harnesses</text>
      <text x="52" y="380" class="featureText">test production modules.</text>
      <path d="M168 474 Q208 430 248 474 Z" fill="#2f6f1f"/>
    </g>
  </g>

  <!-- Footer -->
  <rect x="0" y="2058" width="3840" height="102" fill="url(#blueFooter)"/>
  <text x="1600" y="2120" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#ffffff">@SIH Idea submission - Template</text>
  <text x="3702" y="2120" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">2</text>
</svg>
