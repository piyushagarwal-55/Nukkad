<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Nukkad Technical Approach</title>
  <desc id="desc">A slide-style architecture diagram with system architecture on the left and technology stack on the right.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .title { font: 900 64px Arial, sans-serif; fill: #0b1533; letter-spacing: 1px; }
      .brand { font: 800 24px Arial, sans-serif; fill: #1e3a8a; }
      .h2 { font: 800 24px Arial, sans-serif; fill: #14236b; text-decoration: underline; }
      .h3 { font: 800 23px Arial, sans-serif; fill: #14236b; }
      .label { font: 800 15px Arial, sans-serif; fill: #111827; }
      .small { font: 500 12.5px Arial, sans-serif; fill: #374151; }
      .micro { font: 700 11px Consolas, monospace; fill: #334155; }
      .stack { font: 500 18px Arial, sans-serif; fill: #111827; }
      .stack-small { font: 500 15px Arial, sans-serif; fill: #374151; }
      .iconText { font: 900 34px Arial, sans-serif; fill: #111827; }
      .chipText { font: 900 18px Arial, sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.8; }
      .box2 { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.6; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .amber { fill: #fff7ed; stroke: #d97706; stroke-width: 1.8; }
      .rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; }
      .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .line { stroke: #111827; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #1d4ed8; stroke-width: 2.4; fill: none; marker-end: url(#blueArrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 8 8; }
      .sep { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1100"/>

  <ellipse cx="118" cy="56" rx="84" ry="32" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <text x="62" y="65" class="brand">Nukkad</text>
  <text x="560" y="72" class="title">TECHNICAL APPROACH</text>
  <text x="1525" y="48" class="brand">RAZORPAY</text>
  <text x="1525" y="77" class="brand">AI BUILDATHON</text>
  <text x="1525" y="106" class="brand">2026</text>

  <line x1="760" y1="130" x2="760" y2="1045" stroke="#9ca3af" stroke-width="2"/>

  <!-- Left: System Architecture -->
  <text x="48" y="158" class="h2">◆ System Architecture</text>

  <rect x="226" y="185" width="300" height="52" rx="6" class="box"/>
  <text x="286" y="216" class="label">Shop Owner / Operator</text>

  <path d="M376 237 V263" class="line"/>
  <rect x="226" y="263" width="300" height="52" rx="6" class="box2"/>
  <text x="291" y="294" class="label">Landing Page + OTP Login</text>

  <path d="M376 315 V342" class="line"/>
  <rect x="226" y="342" width="300" height="60" rx="6" class="blue"/>
  <text x="279" y="369" class="label">Next.js Owner Dashboard</text>
  <text x="259" y="391" class="small">orders · customers · inventory · procurement</text>

  <path d="M376 402 V430" class="line"/>
  <rect x="226" y="430" width="300" height="60" rx="6" class="green"/>
  <text x="294" y="457" class="label">Fastify API Backend</text>
  <text x="264" y="479" class="small">auth · agents · payments · channel webhooks</text>

  <path d="M376 490 V520" class="line"/>
  <rect x="188" y="520" width="376" height="56" rx="5" class="box"/>
  <text x="304" y="554" class="label">Channel Input Processing</text>

  <rect x="96" y="576" width="168" height="88" rx="6" class="box2"/>
  <text x="154" y="607" class="iconText">WA</text>
  <text x="130" y="636" class="label">WhatsApp</text>
  <text x="118" y="655" class="small">text · photo · voice-note</text>

  <rect x="292" y="576" width="168" height="88" rx="6" class="box2"/>
  <text x="350" y="607" class="iconText">OCR</text>
  <text x="319" y="636" class="label">Bill / Catalogue</text>
  <text x="314" y="655" class="small">photo extraction + repair</text>

  <rect x="488" y="576" width="168" height="88" rx="6" class="box2"/>
  <text x="548" y="607" class="iconText">☎</text>
  <text x="525" y="636" class="label">Voice Call</text>
  <text x="512" y="655" class="small">Twilio + WebSocket audio</text>

  <path d="M180 664 V706 H376" class="line"/>
  <path d="M376 664 V706" class="line"/>
  <path d="M572 664 V706 H376" class="line"/>

  <rect x="204" y="706" width="344" height="62" rx="6" class="violet"/>
  <text x="265" y="733" class="label">Content Understanding Layer</text>
  <text x="236" y="755" class="small">STT · vision OCR · intent JSON · zod validation</text>

  <path d="M376 768 V794" class="line"/>
  <rect x="204" y="794" width="344" height="70" rx="6" class="box"/>
  <text x="250" y="820" class="label">Structured Agent State Model</text>
  <text x="232" y="842" class="small">basket · pending action · desk · referents · events</text>
  <text x="276" y="858" class="micro">ConversationFrame + AgentEvent</text>

  <path d="M376 864 V890" class="line"/>
  <rect x="204" y="890" width="344" height="62" rx="6" class="green"/>
  <text x="255" y="917" class="label">Agentic Desk Orchestrator</text>
  <text x="232" y="939" class="small">Reception → Seller → Checkout → Enquiry</text>

  <path d="M376 952 V978" class="line"/>
  <rect x="74" y="978" width="604" height="56" rx="6" class="box"/>
  <text x="249" y="1012" class="label">Verified Business Outcomes</text>

  <rect x="82" y="1034" width="112" height="44" rx="5" class="blue"/>
  <text x="111" y="1061" class="label">Order</text>
  <rect x="210" y="1034" width="112" height="44" rx="5" class="green"/>
  <text x="239" y="1061" class="label">Payment</text>
  <rect x="338" y="1034" width="112" height="44" rx="5" class="amber"/>
  <text x="359" y="1061" class="label">Inventory</text>
  <rect x="466" y="1034" width="112" height="44" rx="5" class="violet"/>
  <text x="492" y="1061" class="label">Demand</text>
  <rect x="594" y="1034" width="112" height="44" rx="5" class="rose"/>
  <text x="613" y="1061" class="label">Supplier</text>

  <!-- Right: Technology Stack -->
  <text x="812" y="158" class="h2">◆ Technology Stack</text>
  <line x1="800" y1="178" x2="1726" y2="178" stroke="#14236b" stroke-width="3"/>

  <!-- Row 1 -->
  <text x="850" y="245" class="h3">Frontend</text>
  <text x="825" y="285" class="stack">Next.js, React</text>
  <text x="815" y="311" class="stack">TypeScript, Tailwind CSS</text>
  <rect x="815" y="355" width="66" height="54" rx="8" fill="#111827"/>
  <text x="828" y="391" class="chipText">NEXT</text>
  <rect x="900" y="355" width="54" height="54" rx="27" fill="#61dafb"/>
  <text x="916" y="390" class="iconText" fill="#0f172a">R</text>
  <rect x="974" y="355" width="54" height="54" rx="8" fill="#3178c6"/>
  <text x="987" y="391" class="chipText">TS</text>

  <text x="1110" y="245" class="h3">Backend</text>
  <text x="1075" y="285" class="stack">Fastify, Node.js</text>
  <text x="1070" y="311" class="stack">Prisma, LangGraph</text>
  <rect x="1090" y="355" width="58" height="54" rx="8" fill="#111827"/>
  <text x="1102" y="390" class="chipText">API</text>
  <rect x="1168" y="355" width="58" height="54" rx="8" fill="#2f855a"/>
  <text x="1178" y="390" class="chipText">LG</text>

  <text x="1342" y="245" class="h3">Generative AI</text>
  <text x="1320" y="285" class="stack">Groq OSS LLM</text>
  <text x="1302" y="311" class="stack">Qwen Vision, JSON mode</text>
  <rect x="1344" y="355" width="66" height="54" rx="8" fill="#f97316"/>
  <text x="1358" y="390" class="chipText">GROQ</text>
  <rect x="1430" y="355" width="58" height="54" rx="8" fill="#7c3aed"/>
  <text x="1442" y="390" class="chipText">AI</text>

  <text x="1558" y="245" class="h3">Document Intelligence</text>
  <text x="1560" y="285" class="stack">Bill OCR, repair</text>
  <text x="1555" y="311" class="stack">critic + catalogue merge</text>
  <rect x="1580" y="355" width="70" height="54" rx="8" fill="#0f172a"/>
  <text x="1591" y="390" class="chipText">OCR</text>
  <rect x="1670" y="355" width="58" height="54" rx="8" fill="#dc2626"/>
  <text x="1684" y="390" class="chipText">KB</text>

  <line x1="800" y1="458" x2="1726" y2="458" class="sep"/>

  <!-- Row 2 -->
  <text x="842" y="520" class="h3">WhatsApp + Messaging</text>
  <text x="818" y="560" class="stack">Twilio Sandbox, Evolution API</text>
  <text x="820" y="586" class="stack-small">OCR photos, order chat, payment logging, supplier alerts</text>
  <rect x="850" y="628" width="76" height="54" rx="8" fill="#25d366"/>
  <text x="864" y="663" class="chipText">WA</text>
  <rect x="946" y="628" width="76" height="54" rx="8" fill="#f22f46"/>
  <text x="961" y="663" class="chipText">TW</text>

  <text x="1160" y="520" class="h3">Voice + Audio</text>
  <text x="1138" y="560" class="stack">Sarvam STT/TTS</text>
  <text x="1116" y="586" class="stack-small">8k μ-law bridge, 16k browser PCM, barge-in</text>
  <rect x="1144" y="628" width="76" height="54" rx="8" fill="#0f766e"/>
  <text x="1159" y="663" class="chipText">STT</text>
  <rect x="1240" y="628" width="76" height="54" rx="8" fill="#14b8a6"/>
  <text x="1256" y="663" class="chipText">TTS</text>

  <text x="1432" y="520" class="h3">Payments</text>
  <text x="1405" y="560" class="stack">Razorpay Links</text>
  <text x="1376" y="586" class="stack-small">HMAC webhook, partial payment, settlement</text>
  <rect x="1424" y="628" width="90" height="54" rx="8" fill="#1d4ed8"/>
  <text x="1435" y="663" class="chipText">RZP</text>
  <rect x="1534" y="628" width="84" height="54" rx="8" fill="#059669"/>
  <text x="1546" y="663" class="chipText">₹</text>

  <line x1="800" y1="728" x2="1726" y2="728" class="sep"/>

  <!-- Row 3 -->
  <text x="850" y="790" class="h3">Database</text>
  <text x="828" y="830" class="stack">Supabase PostgreSQL</text>
  <text x="823" y="856" class="stack-small">conversation state, orders, invoices, events</text>
  <rect x="862" y="900" width="82" height="54" rx="8" fill="#336791"/>
  <text x="876" y="935" class="chipText">PG</text>

  <text x="1108" y="790" class="h3">Security &amp; Verification</text>
  <text x="1088" y="830" class="stack">OTP, cookies, HMAC</text>
  <text x="1060" y="856" class="stack-small">zod schemas, timing-safe compare, event audit</text>
  <rect x="1106" y="900" width="84" height="54" rx="8" fill="#111827"/>
  <text x="1120" y="935" class="chipText">JWT</text>
  <rect x="1210" y="900" width="84" height="54" rx="8" fill="#16a34a"/>
  <text x="1222" y="935" class="chipText">SIG</text>

  <text x="1395" y="790" class="h3">Evals &amp; Measurement</text>
  <text x="1378" y="830" class="stack">dialogue, fold, photo, bill</text>
  <text x="1360" y="856" class="stack-small">latency, ASR, TTS, adversarial payments</text>
  <rect x="1410" y="900" width="88" height="54" rx="8" fill="#7c3aed"/>
  <text x="1424" y="935" class="chipText">EVAL</text>
  <rect x="1518" y="900" width="88" height="54" rx="8" fill="#ea580c"/>
  <text x="1534" y="935" class="chipText">P95</text>

  <text x="1602" y="790" class="h3">Deployment</text>
  <text x="1580" y="830" class="stack">Render, Vercel</text>
  <text x="1553" y="856" class="stack-small">ngrok local webhooks, Supabase pooler</text>
  <rect x="1586" y="900" width="72" height="54" rx="8" fill="#000000"/>
  <text x="1600" y="935" class="chipText">VC</text>
  <rect x="1678" y="900" width="72" height="54" rx="8" fill="#46e3b7"/>
  <text x="1692" y="935" class="chipText">RN</text>

  <!-- Bottom strip -->
  <rect x="800" y="1004" width="926" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="822" y="1028" class="label">High-level agentic guarantees</text>
  <text x="822" y="1050" class="small">One final utterance → one semantic frame → one desk policy outcome → one verified business command → one audited response. Payment links are created by code only after final basket confirmation.</text>
</svg>
